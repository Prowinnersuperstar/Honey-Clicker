<script>

let honey = 0;

let clickPower = 1;

let honeyPerSecond = 0;


let multiplier = 1;

let secondMultiplier = 1;




// Pooh

let poohLevel = 0;

let poohHoney = 1;

let poohActive = false;

let poohTotalHoney = 0;




// Rebirth

let rebirths = 0;

let rebirthMultiplier = 1;





// Achievements

let achievements = {

    firstHoney:false,

    thousandHoney:false,

    millionHoney:false,

    billionHoney:false,

    trillionHoney:false,


    firstRebirth:false,

    tenRebirths:false,

    hundredRebirths:false,


    poohFriend:false,

    poohHelper:false,

    poohKing:false,


    beeKeeper:false,

    hiveOwner:false,

    scientistBee:false,

    factoryOwner:false,

    beeKingdom:false,


    hundredClicks:false,

    tenThousandClicks:false,

    millionClicks:false,


    luckyBee:false,

    lateNightBee:false,

    sleepingBee:false,

    beeCollector:false,

    trueHoneyKing:false

};



let totalClicks = 0;

let upgradesBought = 0;

let sessionStart = Date.now();

let lastPlayed = Date.now();






let upgrades = {


click:{cost:10},

bee:{cost:50},

pooh:{cost:500},

hive:{cost:200},

machine:{cost:1000},

royal:{cost:10000},

gold:{cost:500},

queen:{cost:2000},

garden:{cost:5000},

extractor:{cost:10000},

farm:{cost:250000},

mega:{cost:1000000},

forest:{cost:5000000},

kingdom:{cost:25000000},

factory:{cost:1000000000}


};





let backupCode = "";







function clickHoney(){


    honey += clickPower * multiplier * rebirthMultiplier;


    totalClicks++;


    saveGame();

    update();


}








function buy(type){


    let cost = upgrades[type].cost;



    if(honey >= cost){


        honey -= cost;


        upgradesBought++;




        if(type=="click"){

            clickPower += 1;

        }





        if(type=="bee"){

            honeyPerSecond += 1;

        }





        if(type=="pooh"){


            poohLevel++;


            poohHoney = poohLevel;


            startPooh();


        }





        if(type=="hive"){

            honeyPerSecond += 10;

        }





        if(type=="machine"){

            honeyPerSecond += 100;

        }





        if(type=="royal"){

            honeyPerSecond += 1000;

        }





        if(type=="gold"){

            honeyPerSecond += 5;

        }





        if(type=="queen"){

            honeyPerSecond += 25;

        }





        if(type=="garden"){

            secondMultiplier *= 2;

        }





        if(type=="extractor"){

            honeyPerSecond += 100;

        }





        if(type=="farm"){

            honeyPerSecond += 250;

        }





        if(type=="mega"){

            honeyPerSecond += 1000;

        }





        if(type=="forest"){

            secondMultiplier *= 3;

        }





        if(type=="kingdom"){

            honeyPerSecond += 5000;

        }





        if(type=="factory"){

            honeyPerSecond += 25000;

        }




        upgrades[type].cost *= 2;



        saveGame();

        update();


    }


}







setInterval(function(){

    honey += honeyPerSecond * secondMultiplier;

    update();

},1000);


    setInterval(saveGame,10000);
    
    // SAVE GAME

function saveGame(){


    localStorage.setItem(

        "HoneyClickSave",

        JSON.stringify({

            honey,

            clickPower,

            honeyPerSecond,

            multiplier,

            secondMultiplier,


            poohLevel,

            poohHoney,

            poohTotalHoney,


            rebirths,

            rebirthMultiplier,


            upgrades,


            totalClicks,

            upgradesBought,


            achievements,


            lastPlayed


        })

    );


}







// LOAD GAME

function loadGame(){


    let save = localStorage.getItem("HoneyClickSave");



    if(save){


        let data = JSON.parse(save);



        honey = data.honey || 0;

        clickPower = data.clickPower || 1;

        honeyPerSecond = data.honeyPerSecond || 0;


        multiplier = data.multiplier || 1;

        secondMultiplier = data.secondMultiplier || 1;



        poohLevel = data.poohLevel || 0;

        poohHoney = data.poohHoney || 1;

        poohTotalHoney = data.poohTotalHoney || 0;



        rebirths = data.rebirths || 0;

        rebirthMultiplier = data.rebirthMultiplier || 1;



        totalClicks = data.totalClicks || 0;

        upgradesBought = data.upgradesBought || 0;



        if(data.upgrades){

            upgrades = data.upgrades;

        }



        if(data.achievements){

            achievements = data.achievements;

        }



        lastPlayed = data.lastPlayed || Date.now();



        if(poohLevel > 0){

            startPooh();

        }


    }


    update();


}







// REBIRTH

function rebirth(){


    if(honey >= 1000000){


        rebirths++;


        rebirthMultiplier += 0.2;



        honey = 0;

        clickPower = 1;

        honeyPerSecond = 0;

        multiplier = 1;

        secondMultiplier = 1;



        poohLevel = 0;

        poohHoney = 1;

        poohTotalHoney = 0;



        upgrades = {


            click:{cost:10},

            bee:{cost:50},

            pooh:{cost:500},

            hive:{cost:200},

            machine:{cost:1000},

            royal:{cost:10000},

            gold:{cost:500},

            queen:{cost:2000},

            garden:{cost:5000},

            extractor:{cost:10000},

            farm:{cost:250000},

            mega:{cost:1000000},

            forest:{cost:5000000},

            kingdom:{cost:25000000},

            factory:{cost:1000000000}


        };



        saveGame();

        update();



        alert("🔄 Rebirth complete! Click bonus: x" + rebirthMultiplier);


    }


    else {


        alert("You need 1,000,000 honey!");

    }


}









// BACKUP CODE

function createBackup(){


    let save = {


        honey,

        clickPower,

        honeyPerSecond,

        multiplier,

        secondMultiplier,


        poohLevel,

        poohHoney,

        poohTotalHoney,


        rebirths,

        rebirthMultiplier,


        upgrades,


        totalClicks,

        upgradesBought,


        achievements


    };



    backupCode = "HNY-" + btoa(JSON.stringify(save));


    document.getElementById("code").innerHTML = backupCode;


}







function copyCode(){


    navigator.clipboard.writeText(backupCode);


    alert("Backup copied!");


}







function loadBackup(){


    let code = document.getElementById("restoreInput").value;



    try {


        let data = JSON.parse(

            atob(code.replace("HNY-",""))

        );



        honey = data.honey || 0;

        clickPower = data.clickPower || 1;

        honeyPerSecond = data.honeyPerSecond || 0;


        multiplier = data.multiplier || 1;

        secondMultiplier = data.secondMultiplier || 1;



        poohLevel = data.poohLevel || 0;

        poohHoney = data.poohHoney || 1;

        poohTotalHoney = data.poohTotalHoney || 0;



        rebirths = data.rebirths || 0;

        rebirthMultiplier = data.rebirthMultiplier || 1;



        upgrades = data.upgrades || upgrades;


        achievements = data.achievements || achievements;



        saveGame();

        update();



        alert("Backup loaded!");


    }


    catch {


        alert("Invalid backup code!");

    }


}







// POOH

function startPooh(){


    let pooh = document.getElementById("pooh");


    pooh.style.display = "block";



    if(!poohActive){


        poohActive = true;


        movePooh();


    }


}







function movePooh(){


    let pooh = document.getElementById("pooh");


    let x = 0;

    let y = 300;


    let speedX = 3;

    let speedY = 2;



    function animate(){


        x += speedX;

        y += speedY;



        if(x + pooh.width >= window.innerWidth || x <= 0){

            speedX *= -1;

        }



        if(y + pooh.height >= window.innerHeight || y <= 0){

            speedY *= -1;

        }



        pooh.style.left = x + "px";

        pooh.style.top = y + "px";



        requestAnimationFrame(animate);


    }


    animate();


}







// POOH MAKES HONEY EVERY 0.5 SECONDS

setInterval(function(){


    if(poohLevel > 0){


        honey += poohHoney;


        poohTotalHoney += poohHoney;


        update();

        saveGame();


    }


},500);

// ACHIEVEMENT CHECKING
// ===============================

function checkAchievements(){

    if(honey >= 1)
        achievements.firstHoney = true;

    if(honey >= 1000)
        achievements.thousandHoney = true;

    if(honey >= 1000000)
        achievements.millionHoney = true;

    if(honey >= 1000000000)
        achievements.billionHoney = true;

    if(honey >= 1000000000000)
        achievements.trillionHoney = true;


    if(rebirths >= 1)
        achievements.firstRebirth = true;

    if(rebirths >= 10)
        achievements.tenRebirths = true;

    if(rebirths >= 100)
        achievements.hundredRebirths = true;


    if(poohLevel >= 1)
        achievements.poohFriend = true;

    if(poohTotalHoney >= 10000)
        achievements.poohHelper = true;

    if(poohLevel >= 50)
        achievements.poohKing = true;


    if(upgradesBought >= 10)
        achievements.beeKeeper = true;


    // FIXED: checks bought amount instead of cost
    if(upgrades.hive.cost > 200)
        achievements.hiveOwner = true;


    if(upgrades.extractor.cost > 10000)
        achievements.scientistBee = true;


    if(upgrades.factory.cost > 1000000000)
        achievements.factoryOwner = true;


    if(upgrades.kingdom.cost > 25000000)
        achievements.beeKingdom = true;


    if(totalClicks >= 100)
        achievements.hundredClicks = true;

    if(totalClicks >= 10000)
        achievements.tenThousandClicks = true;

    if(totalClicks >= 1000000)
        achievements.millionClicks = true;


    if(totalClicks >= 500)
        achievements.luckyBee = true;


    // 1 hour played
    if(Date.now() - sessionStart >= 3600000)
        achievements.lateNightBee = true;


    if(honeyPerSecond >= 1000)
        achievements.sleepingBee = true;


    if(upgradesBought >= 50)
        achievements.beeCollector = true;


    if(rebirths >= 25)
        achievements.trueHoneyKing = true;



}

    if(achievements.poohKing)

    if(achievements.beeKeeper)

    if(achievements.hiveOwner)

    if(achievements.scientistBee)

// ===============================
// NORMAL UPDATE FUNCTION
// ===============================

function update(){

    document.getElementById("honey").innerHTML =
    "🍯 Honey: " + Math.floor(honey);


    document.getElementById("power").innerHTML =
    "Honey per click: " +
    Math.floor(clickPower * multiplier * rebirthMultiplier);


    document.getElementById("auto").innerHTML =
    "Honey per second: " +
    Math.floor(honeyPerSecond * secondMultiplier);


    document.getElementById("rebirthStat").innerHTML =
    "Rebirths: " + rebirths +
    " | Bonus: x" +
    rebirthMultiplier;



    for(let i in upgrades){

        let cost = document.getElementById(i+"Cost");

        if(cost){

            cost.innerHTML = upgrades[i].cost;

        }

    }

}


let normalUpdate = update;

update = function(){

    normalUpdate();

    checkAchievements();

    updateAchievements();

};

loadGame();
