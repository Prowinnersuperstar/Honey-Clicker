<!DOCTYPE html>
<html>
<head>
<title>Honey Click</title>

<style>

body {
    text-align: center;
    font-family: Arial, sans-serif;
    background: #fff3a6;
    margin: 0;
}

h1 {
    color: #d68b00;
}


/* Honey */

#honey {
    font-size: 40px;
    margin-top: 30px;
}


/* Click button */

#click {
    font-size: 80px;
    background: none;
    border: none;
    cursor: pointer;
    margin-top: 80px;
}

#click:hover {
    transform: scale(1.1);
}


/* Backup */

#backup {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 170px;
    background: #fff0a8;
    padding: 8px;
    border-radius: 10px;
    font-size: 12px;
}

#backup button {
    font-size: 11px;
    margin: 3px;
}

#backup input {
    width: 150px;
    font-size: 11px;
}

#code {
    word-break: break-all;
    font-size: 10px;
    max-height: 80px;
    overflow-y: auto;
    background: white;
    padding: 5px;
    border-radius: 5px;
}


/* Upgrade shop */

#shop {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 180px;
    max-height: 500px;
    overflow-y: auto;
    background: #ffe066;
    padding: 8px;
    border-radius: 12px;
}

#shop h2 {
    font-size: 18px;
}


.upgrade {
    width: 100%;
    margin: 3px;
    padding: 6px;
    font-size: 11px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #ff9f1c;
}

.upgrade:hover {
    background: #ffb84d;
}


/* Stats */

#stats {
    font-size: 20px;
}

</style>

</head>


<body>


<h1>Honey Click</h1>


<!-- Backup -->

<div id="backup">

<h3>💾 Backup</h3>

<button onclick="createBackup()">
Create Code
</button>

<p id="code">
No code created
</p>

<button onclick="copyCode()">
Copy Code
</button>

<br>

<input id="restoreInput" placeholder="Enter backup code">

<button onclick="loadBackup()">
Load
</button>

</div>



<div id="honey">
🍯 Honey: 0
</div>


<button id="click" onclick="clickHoney()">
🍯
</button>




<!-- Shop -->

<div id="shop">

<h2>Upgrades</h2>


<button class="upgrade" onclick="buy('click')">
🍯 Honey Clicker<br>
+1 Click<br>
Cost: <span id="clickCost"></span>
</button>



<button class="upgrade" onclick="buy('bee')">
🐝 Bee Helper<br>
+1/sec<br>
Cost: <span id="beeCost"></span>
</button>



<button class="upgrade" onclick="buy('hive')">
🏠 Bigger Hive<br>
x2 Click<br>
Cost: <span id="hiveCost"></span>
</button>



<button class="upgrade" onclick="buy('gold')">
✨ Golden Bee<br>
+5/sec<br>
Cost: <span id="goldCost"></span>
</button>



<button class="upgrade" onclick="buy('queen')">
👑 Queen Bee<br>
+25/sec<br>
Cost: <span id="queenCost"></span>
</button>



<button class="upgrade" onclick="buy('garden')">
🌸 Flower Garden<br>
x2/sec<br>
Cost: <span id="gardenCost"></span>
</button>



<button class="upgrade" onclick="buy('extractor')">
🧪 Honey Extractor<br>
+100/sec<br>
Cost: <span id="extractorCost"></span>
</button>



<button class="upgrade" onclick="buy('royal')">
💎 Royal Hive<br>
x5 Click<br>
Cost: <span id="royalCost"></span>
</button>



<button class="upgrade" onclick="buy('honeyBoost')">
🍯 Honey Boost<br>
x1.5 Click<br>
Cost: <span id="honeyBoostCost"></span>
</button>



<button class="upgrade" onclick="buy('superBoost')">
🌟 Super Boost<br>
x2.5 Click<br>
Cost: <span id="superBoostCost"></span>
</button>



<button class="upgrade" onclick="buy('farm')">
🐝 Bee Farm<br>
+250/sec<br>
Cost: <span id="farmCost"></span>
</button>



<button class="upgrade" onclick="buy('mega')">
🏭 Mega Extractor<br>
+1000/sec<br>
Cost: <span id="megaCost"></span>
</button>



<button class="upgrade" onclick="buy('forest')">
🌳 Golden Forest<br>
x3/sec<br>
Cost: <span id="forestCost"></span>
</button>



<button class="upgrade" onclick="buy('kingdom')">
👑 Bee Kingdom<br>
+5000/sec<br>
Cost: <span id="kingdomCost"></span>
</button>



<button class="upgrade" onclick="buy('nectar')">
🌟 Royal Nectar<br>
x10 Click<br>
Cost: <span id="nectarCost"></span>
</button>



<button class="upgrade" onclick="buy('factory')">
🚀 Honey Factory<br>
+25000/sec<br>
Cost: <span id="factoryCost"></span>
</button>


</div>



<div id="stats">

<p id="power">
Honey per click: 1
</p>

<p id="auto">
Honey per second: 0
</p>

</div>
