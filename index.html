<!DOCTYPE html>
<html>
<head>
<title>Honey Click</title>

<style>

body {
    text-align:center;
    font-family:Arial,sans-serif;
    background:#fff3a6;
    margin:0;
}

h1 {
    color:#d68b00;
}


#honey {
    font-size:40px;
    margin-top:30px;
}


#click {
    font-size:80px;
    background:none;
    border:none;
    cursor:pointer;
    margin-top:80px;
}

#click:hover {
    transform:scale(1.1);
}



/* Backup */

#backup {
    position:absolute;
    top:10px;
    left:10px;
    width:170px;
    background:#fff0a8;
    padding:8px;
    border-radius:10px;
    font-size:12px;
}

#backup button {
    font-size:11px;
    margin:3px;
}

#backup input {
    width:150px;
    font-size:11px;
}

#code {
    word-break:break-all;
    font-size:10px;
    max-height:80px;
    overflow-y:auto;
    background:white;
    padding:5px;
    border-radius:5px;
}



/* Shop */

#shop {
    position:absolute;
    top:10px;
    right:10px;
    width:180px;
    max-height:500px;
    overflow-y:auto;
    background:#ffe066;
    padding:8px;
    border-radius:12px;
}


#shop h2 {
    font-size:18px;
}



.upgrade {
    width:100%;
    margin:3px;
    padding:6px;
    font-size:11px;
    cursor:pointer;
    border:none;
    border-radius:6px;
    background:#ff9f1c;
}


.upgrade:hover {
    background:#ffb84d;
}



#stats {
    font-size:20px;
}


</style>

</head>


<body>


<h1>Honey Click</h1>



<div id="backup">

<h3>💾 Backup</h3>

<button onclick="createBackup()">
Create Code
</button>

<p id="code">
No code created
</p>

<button onclick="copyCode()">
Copy Code
</button>

<br>

<input id="restoreInput" placeholder="Enter backup code">

<button onclick="loadBackup()">
Load
</button>

</div>





<div id="honey">
🍯 Honey: 0
</div>



<button id="click" onclick="clickHoney()">
🍯
</button>






<div id="shop">

<h2>Upgrades</h2>



<button class="upgrade" onclick="buy('click')">
🍯 Honey Clicker<br>
+1 Click<br>
Cost: <span id="clickCost"></span>
</button>



<button class="upgrade" onclick="buy('bee')">
🐝 Bee Helper<br>
+1/sec<br>
Cost: <span id="beeCost"></span>
</button>



<button class="upgrade" onclick="buy('hive')">
🏠 Bigger Hive<br>
+10 Honey/sec<br>
Cost: <span id="hiveCost"></span>
</button>


<button class="upgrade" onclick="buy('machine')">
🍯 Honey Machine<br>
+100 Honey/sec<br>
Cost: <span id="machineCost"></span>
</button>


<button class="upgrade" onclick="buy('royal')">
👑 Royal Hive<br>
+1000 Honey/sec<br>
Cost: <span id="royalCost"></span>
</button>



<button class="upgrade" onclick="buy('gold')">
✨ Golden Bee<br>
+5/sec<br>
Cost: <span id="goldCost"></span>
</button>



<button class="upgrade" onclick="buy('queen')">
👑 Queen Bee<br>
+25/sec<br>
Cost: <span id="queenCost"></span>
</button>



<button class="upgrade" onclick="buy('garden')">
🌸 Flower Garden<br>
x2/sec<br>
Cost: <span id="gardenCost"></span>
</button>



<button class="upgrade" onclick="buy('extractor')">
🧪 Honey Extractor<br>
+100/sec<br>
Cost: <span id="extractorCost"></span>
</button>



<button class="upgrade" onclick="buy('farm')">
🐝 Bee Farm<br>
+250/sec<br>
Cost: <span id="farmCost"></span>
</button>



<button class="upgrade" onclick="buy('mega')">
🏭 Mega Extractor<br>
+1000/sec<br>
Cost: <span id="megaCost"></span>
</button>



<button class="upgrade" onclick="buy('forest')">
🌳 Golden Forest<br>
x3/sec<br>
Cost: <span id="forestCost"></span>
</button>



<button class="upgrade" onclick="buy('kingdom')">
👑 Bee Kingdom<br>
+5000/sec<br>
Cost: <span id="kingdomCost"></span>
</button>



<button class="upgrade" onclick="buy('factory')">
🚀 Honey Factory<br>
+25000/sec<br>
Cost: <span id="factoryCost"></span>
</button>



</div>





<div id="stats">

<p id="power">
Honey per click: 1
</p>


<p id="auto">
Honey per second: 0
</p>


</div>
</body>
</html>
<script>

let honey = 0;
let clickPower = 1;
let honeyPerSecond = 0;

let multiplier = 1;
let secondMultiplier = 1;


let upgrades = {

click:{cost:10},

bee:{cost:50},

hive:{cost:200},

machine:{cost:1000},

royal:{cost:10000},

gold:{cost:500},

queen:{cost:2000},

garden:{cost:5000},

extractor:{cost:10000},

farm:{cost:250000},

mega:{cost:1000000},

forest:{cost:5000000},

kingdom:{cost:25000000},

factory:{cost:1000000000}

};


let backupCode = "";





function clickHoney(){

    honey += clickPower * multiplier;

    saveGame();
    update();

}







function buy(type){

    let cost = upgrades[type].cost;


    if(honey >= cost){


        honey -= cost;



        if(type=="click")
            clickPower += 1;



        if(type=="bee")
            honeyPerSecond += 1;



        if(type=="hive")
            multiplier *= 1.5;



        if(type=="machine")
            multiplier *= 2.5;



        if(type=="royal")
            multiplier *= 5;



        if(type=="gold")
            honeyPerSecond += 5;



        if(type=="queen")
            honeyPerSecond += 25;



        if(type=="garden")
            secondMultiplier *= 2;



        if(type=="extractor")
            honeyPerSecond += 100;



        if(type=="farm")
            honeyPerSecond += 250;



        if(type=="mega")
            honeyPerSecond += 1000;



        if(type=="forest")
            secondMultiplier *= 3;



        if(type=="kingdom")
            honeyPerSecond += 5000;



        if(type=="factory")
            honeyPerSecond += 25000;



        upgrades[type].cost *= 2;


        saveGame();
        update();

    }

}








setInterval(function(){

    honey += honeyPerSecond * secondMultiplier;

    saveGame();
    update();

},1000);










// SAVE TO DEVICE


function saveGame(){

    localStorage.setItem(
        "HoneyClickSave",

        JSON.stringify({

            honey,

            clickPower,

            honeyPerSecond,

            multiplier,

            secondMultiplier,

            upgrades

        })

    );

}








function loadGame(){


    let save = localStorage.getItem("HoneyClickSave");


    if(save){


        let data = JSON.parse(save);


        honey = data.honey || 0;

        clickPower = data.clickPower || 1;

        honeyPerSecond = data.honeyPerSecond || 0;

        multiplier = data.multiplier || 1;

        secondMultiplier = data.secondMultiplier || 1;


        if(data.upgrades){

            for(let i in upgrades){

                if(data.upgrades[i]){

                    upgrades[i] = data.upgrades[i];

                }

            }

        }

    }


    update();

}









// BACKUP CODE


function createBackup(){


    let save = {


        honey,

        clickPower,

        honeyPerSecond,

        multiplier,

        secondMultiplier,

        upgrades


    };


    backupCode = "HNY-" + btoa(JSON.stringify(save));


    document.getElementById("code").innerHTML = backupCode;


}






function copyCode(){


    navigator.clipboard.writeText(backupCode);


    alert("Backup code copied!");

}







function loadBackup(){


    let code = document.getElementById("restoreInput").value;


    try{


        let data = JSON.parse(

            atob(code.replace("HNY-",""))

        );



        honey = data.honey || 0;

        clickPower = data.clickPower || 1;

        honeyPerSecond = data.honeyPerSecond || 0;

        multiplier = data.multiplier || 1;

        secondMultiplier = data.secondMultiplier || 1;



        if(data.upgrades){

            for(let i in upgrades){

                if(data.upgrades[i]){

                    upgrades[i] = data.upgrades[i];

                }

            }

        }



        saveGame();

        update();


        alert("Progress restored!");

    }


    catch{


        alert("Invalid backup code!");

    }


}









function update(){


    document.getElementById("honey").innerHTML =

    "🍯 Honey: " + Math.floor(honey);




    document.getElementById("power").innerHTML =

    "Honey per click: " + 

    Math.floor(clickPower * multiplier);




    document.getElementById("auto").innerHTML =

    "Honey per second: " +

    Math.floor(honeyPerSecond * secondMultiplier);




    for(let i in upgrades){


        let element = document.getElementById(i+"Cost");


        if(element){

            element.innerHTML = upgrades[i].cost;

        }


    }


}



loadGame();


</script>
