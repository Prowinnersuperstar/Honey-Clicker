<!DOCTYPE html>
<html>
<head>
<title>Honey Click</title>

<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    background: #fff3a6;
    margin: 0;
}

h1 {
    color: #d68b00;
}

#honey {
    font-size: 40px;
    margin-top: 30px;
}

#click {
    font-size: 80px;
    background: none;
    border: none;
    cursor: pointer;
    margin-top: 80px;
}

#click:hover {
    transform: scale(1.1);
}


/* Upgrade shop */

#shop {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 170px;
    max-height: 450px;
    overflow-y: auto;
    background: #ffe066;
    padding: 8px;
    border-radius: 12px;
}

#shop h2 {
    font-size: 18px;
    margin: 5px;
}

.upgrade {
    width: 100%;
    margin: 3px;
    padding: 6px;
    font-size: 11px;
    cursor: pointer;
    border-radius: 6px;
    border: none;
    background: #ff9f1c;
}

.upgrade:hover {
    background: #ffb84d;
}


/* Backup */

#backup {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 170px;
    background: #fff0a8;
    padding: 8px;
    border-radius: 10px;
    font-size: 12px;
}

#backup button {
    font-size: 11px;
    margin: 3px;
}

#backup input {
    width: 150px;
    font-size: 11px;
}

#code {
    word-break: break-all;
    font-size: 10px;
    max-height: 80px;
    overflow-y: auto;
    background: white;
    padding: 5px;
    border-radius: 5px;
}


#stats {
    font-size: 20px;
}

</style>

</head>


<body>


<h1>Honey Click</h1>


<!-- Backup System -->

<div id="backup">

<h3>💾 Backup</h3>

<button onclick="createBackup()">
Create Code
</button>

<p id="code">
No code created
</p>

<button onclick="copyCode()">
Copy Code
</button>

<br>

<input id="restoreInput" placeholder="Enter backup code">

<button onclick="loadBackup()">
Load
</button>

</div>



<div id="honey">
🍯 Honey: 0
</div>


<button id="click" onclick="clickHoney()">
🍯
</button>




<!-- Upgrade Shop -->

<div id="shop">

<h2>Upgrades</h2>


<button class="upgrade" onclick="buy('click')">
🍯 Honey Clicker<br>
+1 Click<br>
Cost: <span id="clickCost">10</span>
</button>


<button class="upgrade" onclick="buy('bee')">
🐝 Bee Helper<br>
+1/sec<br>
Cost: <span id="beeCost">50</span>
</button>


<button class="upgrade" onclick="buy('hive')">
🏠 Bigger Hive<br>
x2 Click<br>
Cost: <span id="hiveCost">200</span>
</button>


<button class="upgrade" onclick="buy('gold')">
✨ Golden Bee<br>
+5/sec<br>
Cost: <span id="goldCost">500</span>
</button>


<button class="upgrade" onclick="buy('queen')">
👑 Queen Bee<br>
+25/sec<br>
Cost: <span id="queenCost">2000</span>
</button>


<button class="upgrade" onclick="buy('garden')">
🌸 Flower Garden<br>
x2/sec<br>
Cost: <span id="gardenCost">5000</span>
</button>


<button class="upgrade" onclick="buy('extractor')">
🧪 Honey Extractor<br>
+100/sec<br>
Cost: <span id="extractorCost">10000</span>
</button>


<button class="upgrade" onclick="buy('royal')">
💎 Royal Hive<br>
x5 Click<br>
Cost: <span id="royalCost">50000</span>
</button>


</div>



<div id="stats">

<p id="power">
Honey per click: 1
</p>

<p id="auto">
Honey per second: 0
</p>

</div>




<script>


let honey = 0;
let clickPower = 1;
let honeyPerSecond = 0;
let multiplier = 1;
let secondMultiplier = 1;


let upgrades = {

click:{cost:10},
bee:{cost:50},
hive:{cost:200},
gold:{cost:500},
queen:{cost:2000},
garden:{cost:5000},
extractor:{cost:10000},
royal:{cost:50000}

};


let backupCode = "";



function clickHoney(){

honey += clickPower * multiplier;

saveGame();
update();

}




function buy(type){

let cost = upgrades[type].cost;


if(honey >= cost){

honey -= cost;


if(type=="click")
clickPower++;

if(type=="bee")
honeyPerSecond++;

if(type=="hive")
multiplier *= 2;

if(type=="gold")
honeyPerSecond += 5;

if(type=="queen")
honeyPerSecond += 25;

if(type=="garden")
secondMultiplier *= 2;

if(type=="extractor")
honeyPerSecond += 100;

if(type=="royal")
multiplier *= 5;


upgrades[type].cost *= 2;


saveGame();
update();

}

}




setInterval(function(){

honey += honeyPerSecond * secondMultiplier;

saveGame();

update();

},1000);





function saveGame(){

localStorage.setItem(
"HoneyClickSave",

JSON.stringify({

honey,
clickPower,
honeyPerSecond,
multiplier,
secondMultiplier,
upgrades

})

);

}




function loadGame(){

let save = localStorage.getItem("HoneyClickSave");


if(save){

let data = JSON.parse(save);

honey = data.honey;
clickPower = data.clickPower;
honeyPerSecond = data.honeyPerSecond;
multiplier = data.multiplier;
secondMultiplier = data.secondMultiplier;
upgrades = data.upgrades;

}

update();

}





function createBackup(){

let save = {

honey,
clickPower,
honeyPerSecond,
multiplier,
secondMultiplier,
upgrades

};


backupCode = "HNY-" + btoa(JSON.stringify(save));


document.getElementById("code").innerHTML = backupCode;

}




function copyCode(){

navigator.clipboard.writeText(backupCode);

alert("Backup code copied!");

}





function loadBackup(){

let code = document.getElementById("restoreInput").value;


try {

let data = JSON.parse(
atob(code.replace("HNY-",""))
);


honey = data.honey;
clickPower = data.clickPower;
honeyPerSecond = data.honeyPerSecond;
multiplier = data.multiplier;
secondMultiplier = data.secondMultiplier;
upgrades = data.upgrades;


saveGame();
update();


alert("Progress restored!");

}

catch {

alert("Invalid backup code!");

}

}





function update(){


document.getElementById("honey").innerHTML =
"🍯 Honey: " + Math.floor(honey);


document.getElementById("power").innerHTML =
"Honey per click: " + (clickPower * multiplier);


document.getElementById("auto").innerHTML =
"Honey per second: " + (honeyPerSecond * secondMultiplier);



for(let i in upgrades){

document.getElementById(i+"Cost").innerHTML =
upgrades[i].cost;

}


}



loadGame();


</script>


</body>
</html>
